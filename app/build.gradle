plugins { id 'com.android.application' }
android {
    namespace 'org.musicworld.bl40native'
    compileSdk 35
    ndkVersion '25.2.9519653'
    defaultConfig {
        applicationId 'org.musicworld.bl40native.juego'
        minSdk 26
        targetSdk 28
        versionCode 35
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++20 -O2 -fexceptions' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1' } }
    buildTypes {
        debug { debuggable true; jniDebuggable false }
        release { minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}
